name: Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v', e.g., v0.1.0

permissions:
  contents: write # Required so the runner can create a release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        run: |
          mkdir dist
          # Replace 'calculator' below with the actual name from Cargo.toml
          cp target/release/Clac dist/
          tar -czf dist/Clac-linux-x86_64.tar.gz -C dist Clac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Clac-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
